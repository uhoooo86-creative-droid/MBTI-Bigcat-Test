<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교사 티칭 유형 테스트</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f0;
    --white: #ffffff;
    --ink: #111111;
    --ink-soft: #555555;
    --ink-muted: #999999;
    --analyst:  #4f46e5;
    --diplomat: #059669;
    --sentinel: #dc2626;
    --explorer: #d97706;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
  }

  /* ── INTRO ── */
  #intro {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 60px 24px; text-align: center;
  }
  .intro-badge {
    background: var(--ink); color: #fff;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 11px; letter-spacing: 4px;
    padding: 5px 14px; border-radius: 4px; margin-bottom: 24px;
  }
  .intro-title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(40px, 8vw, 88px);
    letter-spacing: -3px; line-height: 0.95;
    margin-bottom: 16px;
  }
  .intro-title span {
    display: inline-block; background: var(--ink); color: #fff;
    padding: 2px 14px 6px; border-radius: 8px;
  }
  .intro-sub {
    font-size: 15px; color: var(--ink-soft);
    line-height: 1.7; max-width: 480px; margin-bottom: 40px;
  }
  .intro-info {
    display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;
    margin-bottom: 48px;
  }
  .intro-chip {
    background: var(--white); border: 2px solid var(--ink);
    border-radius: 30px; padding: 8px 18px;
    font-size: 13px; font-weight: 700;
  }
  .btn-start {
    background: var(--ink); color: #fff;
    border: 3px solid var(--ink); border-radius: 14px;
    padding: 18px 56px; font-size: 18px; font-weight: 900;
    font-family: 'Black Han Sans', sans-serif; letter-spacing: 1px;
    cursor: pointer; transition: all 0.2s;
  }
  .btn-start:hover { background: #fff; color: var(--ink); transform: translateY(-3px); box-shadow: 4px 6px 0 var(--ink); }

  /* ── QUIZ ── */
  #quiz { display: none; min-height: 100vh; padding: 48px 24px 80px; max-width: 700px; margin: 0 auto; }

  .quiz-header { text-align: center; margin-bottom: 40px; }
  .quiz-progress-label {
    font-family: 'Bebas Neue', sans-serif; font-size: 13px;
    letter-spacing: 3px; color: var(--ink-muted); margin-bottom: 10px;
  }
  .progress-bar-wrap {
    background: #e0e0d8; border-radius: 8px; height: 8px;
    border: 2px solid var(--ink); overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%; background: var(--ink);
    border-radius: 6px; transition: width 0.4s ease;
  }

  .question-card {
    background: var(--white); border: 2.5px solid var(--ink);
    border-radius: 20px; padding: 36px 32px 32px;
    box-shadow: 5px 7px 0 var(--ink);
  }
  .q-dimension {
    font-family: 'Bebas Neue', sans-serif; font-size: 12px;
    letter-spacing: 3px; color: var(--ink-muted); margin-bottom: 10px;
  }
  .q-text {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(18px, 3.5vw, 24px);
    line-height: 1.4; margin-bottom: 36px; color: var(--ink);
  }

  /* slider */
  .slider-labels {
    display: flex; justify-content: space-between;
    font-size: 12px; font-weight: 700; color: var(--ink-muted);
    margin-bottom: 10px;
  }
  .slider-wrap {
    position: relative; padding: 10px 0;
  }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 6px;
    background: #e0e0d8; border-radius: 4px;
    border: 2px solid var(--ink); outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--ink); border: 3px solid var(--white);
    box-shadow: 0 0 0 2px var(--ink);
    cursor: pointer; transition: transform 0.15s;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
  input[type=range]::-moz-range-thumb {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--ink); border: 3px solid var(--white);
    box-shadow: 0 0 0 2px var(--ink); cursor: pointer;
  }
  .slider-value-display {
    text-align: center; margin-top: 14px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px; letter-spacing: 2px; color: var(--ink);
  }
  .slider-dots {
    display: flex; justify-content: space-between;
    padding: 0 2px; margin-top: 6px;
  }
  .slider-dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: #ccc; border: 1.5px solid var(--ink);
    flex-shrink: 0;
  }

  .q-nav {
    display: flex; justify-content: space-between;
    align-items: center; margin-top: 32px; gap: 12px;
  }
  .btn-nav {
    border: 2.5px solid var(--ink); border-radius: 12px;
    padding: 12px 28px; font-size: 14px; font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer; transition: all 0.15s; background: var(--white);
  }
  .btn-nav:hover { background: var(--ink); color: #fff; }
  .btn-nav.primary { background: var(--ink); color: #fff; }
  .btn-nav.primary:hover { background: #333; }
  .btn-nav:disabled { opacity: 0.3; cursor: not-allowed; }

  /* ── RESULT ── */
  #result { display: none; padding: 60px 24px 80px; max-width: 780px; margin: 0 auto; }

  .result-header { text-align: center; margin-bottom: 48px; }
  .result-badge {
    background: var(--ink); color: #fff;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 11px; letter-spacing: 4px;
    padding: 5px 14px; border-radius: 4px; margin-bottom: 16px;
    display: inline-block;
  }
  .result-mbti {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(64px, 14vw, 120px);
    letter-spacing: 8px; line-height: 1;
    margin-bottom: 8px;
  }
  .result-name {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(22px, 4vw, 32px);
    margin-bottom: 8px;
  }
  .result-tagline {
    font-size: 14px; color: var(--ink-muted); letter-spacing: 1px;
  }

  /* dimension bars */
  .dim-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 14px; margin-bottom: 32px;
  }
  @media(max-width:520px){ .dim-grid { grid-template-columns: 1fr; } }
  .dim-card {
    background: var(--white); border: 2.5px solid var(--ink);
    border-radius: 16px; padding: 18px 20px;
  }
  .dim-label {
    display: flex; justify-content: space-between;
    font-size: 12px; font-weight: 700; margin-bottom: 10px;
  }
  .dim-label .winner {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px; letter-spacing: 1px;
  }
  .dim-bar-bg {
    height: 10px; background: #e0e0d8;
    border-radius: 6px; border: 2px solid var(--ink); overflow: hidden;
  }
  .dim-bar-fill { height: 100%; border-radius: 4px; transition: width 0.8s ease; }

  /* report card */
  .report-card {
    background: var(--white); border: 2.5px solid var(--ink);
    border-radius: 20px; padding: 32px; margin-bottom: 24px;
    box-shadow: 5px 7px 0 var(--ink);
  }
  .report-section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 11px; letter-spacing: 4px; color: var(--ink-muted);
    margin-bottom: 10px;
  }
  .report-heading {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 20px; margin-bottom: 14px;
  }
  .report-body { font-size: 14px; line-height: 1.8; color: var(--ink-soft); }

  .tag-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .tag {
    border: 2px solid var(--ink); border-radius: 30px;
    padding: 4px 14px; font-size: 12px; font-weight: 700;
    background: var(--bg);
  }

  .strength-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  @media(max-width:480px){ .strength-grid { grid-template-columns: 1fr; } }
  .strength-item {
    background: var(--bg); border: 2px solid var(--ink);
    border-radius: 12px; padding: 12px 14px;
    font-size: 13px; font-weight: 700;
  }
  .strength-item span { font-size: 18px; margin-right: 6px; }

  /* activity match */
  .activity-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap: 10px; margin-top: 14px; }
  .activity-chip {
    border: 2.5px solid var(--ink); border-radius: 12px;
    padding: 10px 12px; text-align: center;
    font-size: 12px; font-weight: 700; line-height: 1.4;
    background: var(--white);
  }
  .activity-chip .a-emoji { font-size: 20px; display: block; margin-bottom: 4px; }

  .btn-to-cards {
    display: block; width: 100%; text-align: center;
    background: var(--ink); color: #fff;
    border: 3px solid var(--ink); border-radius: 14px;
    padding: 18px; font-size: 17px; font-weight: 900;
    font-family: 'Black Han Sans', sans-serif;
    cursor: pointer; text-decoration: none;
    transition: all 0.2s; margin-top: 8px;
  }
  .btn-to-cards:hover { background: #fff; color: var(--ink); transform: translateY(-3px); box-shadow: 4px 6px 0 var(--ink); }

  .btn-retry {
    display: block; width: 100%; text-align: center;
    background: var(--white); color: var(--ink);
    border: 2.5px solid var(--ink); border-radius: 14px;
    padding: 14px; font-size: 14px; font-weight: 700;
    cursor: pointer; margin-top: 12px; transition: all 0.2s;
  }
  .btn-retry:hover { background: #eee; }
</style>
</head>
<body>

<!-- ── INTRO ── -->
<section id="intro">
  <div class="intro-badge">BIGCAT TEACHER TEST</div>
  <h1 class="intro-title">나의 티칭<br><span>유형은?</span></h1>
  <p class="intro-sub">교사의 수업 스타일과 성향을 분석하는<br>MBTI 기반 티칭 유형 테스트입니다.<br>20문항으로 나만의 수업 DNA를 발견하세요.</p>
  <div class="intro-info">
    <div class="intro-chip">📋 총 20문항</div>
    <div class="intro-chip">⏱ 약 3분 소요</div>
    <div class="intro-chip">🎯 16가지 티칭 유형</div>
  </div>
  <button class="btn-start" onclick="startQuiz()">테스트 시작 →</button>
</section>

<!-- ── QUIZ ── -->
<section id="quiz">
  <div class="quiz-header">
    <div class="quiz-progress-label" id="progressLabel">1 / 20</div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressFill" style="width:5%"></div>
    </div>
  </div>

  <div class="question-card">
    <div class="q-dimension" id="qDimension"></div>
    <div class="q-text" id="qText"></div>

    <div class="slider-labels">
      <span id="labelLeft">전혀 아니다</span>
      <span id="labelRight">매우 그렇다</span>
    </div>
    <div class="slider-wrap">
      <input type="range" id="slider" min="1" max="5" value="3"
        oninput="onSliderInput(this.value)">
      <div class="slider-dots">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>
    <div class="slider-value-display" id="sliderDisplay">보통이다</div>

    <div class="q-nav">
      <button class="btn-nav" id="btnPrev" onclick="prevQ()">← 이전</button>
      <button class="btn-nav primary" id="btnNext" onclick="nextQ()">다음 →</button>
    </div>
  </div>
</section>

<!-- ── RESULT ── -->
<section id="result">
  <div class="result-header">
    <div class="result-badge">MY TEACHING TYPE</div>
    <div class="result-mbti" id="resultMBTI"></div>
    <div class="result-name" id="resultName"></div>
    <div class="result-tagline" id="resultTagline"></div>
  </div>

  <div class="dim-grid" id="dimGrid"></div>

  <div class="report-card" id="reportStyle">
    <div class="report-section-title">TEACHING STYLE</div>
    <div class="report-heading" id="reportStyleHead"></div>
    <div class="report-body" id="reportStyleBody"></div>
  </div>

  <div class="report-card" id="reportStrength">
    <div class="report-section-title">STRENGTH IN CLASS</div>
    <div class="report-heading">수업 강점</div>
    <div class="strength-grid" id="strengthGrid"></div>
  </div>

  <div class="report-card" id="reportActivity">
    <div class="report-section-title">RECOMMENDED ACTIVITY</div>
    <div class="report-heading">나에게 맞는 활동 카드</div>
    <div class="report-body" id="activityDesc"></div>
    <div class="activity-cards" id="activityGrid"></div>
  </div>

  <div class="report-card">
    <div class="report-section-title">GROWTH POINT</div>
    <div class="report-heading">함께 키우면 좋은 역량</div>
    <div class="report-body" id="reportGrowth"></div>
    <div class="tag-list" id="growthTags"></div>
  </div>

  <a href="https://uhoooo86-creative-droid.github.io/MBTI-Bigcat-Teacher/" class="btn-to-cards">🎴 활동 카드 바로 보기 →</a>
  <button class="btn-retry" onclick="retry()">↺ 다시 테스트하기</button>
</section>

<script>
// ── QUESTIONS ──
const questions = [
  // E vs I (홀수 = E방향, 짝수 = I방향)
  {dim:"E/I", dir:"E", text:"수업 중 학생들과 즉흥적인 대화를 나누는 것이 에너지를 준다."},
  {dim:"E/I", dir:"I", text:"수업 전 혼자 충분히 준비하고 연구하는 시간이 꼭 필요하다."},
  {dim:"E/I", dir:"E", text:"학생들의 반응과 에너지에 맞춰 수업 방식을 바꾸는 것이 자연스럽다."},
  {dim:"E/I", dir:"I", text:"소그룹 활동보다 개인 심화 과제를 설계하는 것이 더 만족스럽다."},
  {dim:"E/I", dir:"E", text:"수업이 끝난 후 학생들과 나눈 상호작용에서 힘을 얻는다."},

  // S vs N
  {dim:"S/N", dir:"S", text:"수업 계획은 구체적인 단계와 명확한 목표로 세부적으로 짠다."},
  {dim:"S/N", dir:"N", text:"수업 주제를 넘어 다른 분야와 연결하는 아이디어가 자주 떠오른다."},
  {dim:"S/N", dir:"S", text:"학생들에게 검증된 방법과 교과서 기반으로 가르치는 것이 중요하다."},
  {dim:"S/N", dir:"N", text:"교육과정에 없더라도 흥미로운 주제를 수업에 녹이고 싶다."},
  {dim:"S/N", dir:"S", text:"수업에서 실용적이고 즉시 활용 가능한 내용을 우선시한다."},

  // T vs F
  {dim:"T/F", dir:"T", text:"수업 목표 달성 여부를 데이터와 평가 결과로 판단한다."},
  {dim:"T/F", dir:"F", text:"학생의 감정 상태가 학습에 미치는 영향을 항상 고려한다."},
  {dim:"T/F", dir:"T", text:"피드백은 감정보다 사실에 근거해서 명확하게 전달해야 한다."},
  {dim:"T/F", dir:"F", text:"학생과의 신뢰 관계를 쌓는 것이 교과 내용 전달만큼 중요하다."},
  {dim:"T/F", dir:"T", text:"수업 효율과 성취 기준 달성이 관계 형성보다 우선이다."},

  // J vs P
  {dim:"J/P", dir:"J", text:"수업 계획은 미리 완성하고 그 계획대로 진행하는 것이 편하다."},
  {dim:"J/P", dir:"P", text:"수업 상황에 따라 즉흥적으로 활동을 바꾸는 것이 오히려 재미있다."},
  {dim:"J/P", dir:"J", text:"수업 마무리가 깔끔하게 정리될 때 만족감을 느낀다."},
  {dim:"J/P", dir:"P", text:"정해진 순서보다 학생들의 흐름에 따라 수업이 진행되는 것이 좋다."},
  {dim:"J/P", dir:"J", text:"수업 준비물, 자료, 일정을 미리 체계적으로 관리하는 편이다."},
];

const sliderLabels = ["전혀 아니다", "아니다", "보통이다", "그렇다", "매우 그렇다"];
const dimColors = {
  "E/I": "#4f46e5", "S/N": "#059669", "T/F": "#dc2626", "J/P": "#d97706"
};

let answers = new Array(20).fill(3);
let current = 0;

function startQuiz() {
  document.getElementById('intro').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  renderQ();
}

function renderQ() {
  const q = questions[current];
  document.getElementById('progressLabel').textContent = `${current+1} / 20`;
  document.getElementById('progressFill').style.width = `${((current+1)/20)*100}%`;
  document.getElementById('qDimension').textContent = `DIMENSION ${q.dim} · Q${current+1}`;
  document.getElementById('qDimension').style.color = dimColors[q.dim];
  document.getElementById('qText').textContent = q.text;

  const slider = document.getElementById('slider');
  slider.value = answers[current];
  slider.style.accentColor = dimColors[q.dim];
  onSliderInput(answers[current]);

  document.getElementById('btnPrev').disabled = current === 0;
  document.getElementById('btnNext').textContent = current === 19 ? '결과 보기 →' : '다음 →';
}

function onSliderInput(val) {
  answers[current] = parseInt(val);
  document.getElementById('sliderDisplay').textContent = sliderLabels[val-1];
}

function nextQ() {
  if (current < 19) { current++; renderQ(); }
  else showResult();
}

function prevQ() {
  if (current > 0) { current--; renderQ(); }
}

// ── SCORING ──
function calcMBTI() {
  const scores = {E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0};
  questions.forEach((q, i) => {
    const val = answers[i]; // 1~5
    const [a, b] = q.dim.split('/');
    if (q.dir === a) { scores[a] += val; scores[b] += (6-val); }
    else             { scores[b] += val; scores[a] += (6-val); }
  });
  const type =
    (scores.E >= scores.I ? 'E' : 'I') +
    (scores.S >= scores.N ? 'S' : 'N') +
    (scores.T >= scores.F ? 'T' : 'F') +
    (scores.J >= scores.P ? 'J' : 'P');
  return { type, scores };
}

// ── TYPE DATA ──
const typeData = {
  INTJ:{ name:"전략적 설계자", tagline:"치밀하게 준비하고 혼자서도 완성하는 교사", color:"#4f46e5",
    style:"수업을 하나의 프로젝트처럼 설계합니다. 목표를 명확히 하고 단계별 미션으로 구조화하는 데 탁월합니다. 감정보다 성과를 중시하며, 학생이 스스로 문제를 해결하도록 유도합니다.",
    strengths:["🎯 체계적 수업 설계","🧩 복잡한 개념 구조화","📊 학습 성과 분석","💡 독창적 커리큘럼"],
    activities:[{e:"🎯",n:"격파 미션 카드"},{e:"🧩",n:"Why vs Because"},{e:"💡",n:"아인슈타인"}],
    growth:"학생과의 감정적 연결을 늘려보세요. 티칭에 따뜻함이 더해지면 학생의 몰입이 깊어집니다.",

// ── SHOW RESULT ──
function showResult() {
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('result').style.display = 'block';

  const {type, scores} = calcMBTI();
  const d = typeData[type];

  document.getElementById('resultMBTI').textContent = type;
  document.getElementById('resultMBTI').style.color = d.color;
  document.getElementById('resultName').textContent = d.name;
  document.getElementById('resultTagline').textContent = d.tagline;

  // dimension bars
  const dims = [
    {label:'E vs I', a:'E', b:'I', sa:scores.E, sb:scores.I},
    {label:'S vs N', a:'S', b:'N', sa:scores.S, sb:scores.N},
    {label:'T vs F', a:'T', b:'F', sa:scores.T, sb:scores.F},
    {label:'J vs P', a:'J', b:'P', sa:scores.J, sb:scores.P},
  ];
  const colors2 = ["#4f46e5","#059669","#dc2626","#d97706"];
  const dg = document.getElementById('dimGrid');
  dg.innerHTML = '';
  dims.forEach((dim, i) => {
    const total = dim.sa + dim.sb;
    const pct = Math.round(dim.sa / total * 100);
    const winner = dim.sa >= dim.sb ? dim.a : dim.b;
    const winPct = dim.sa >= dim.sb ? pct : 100-pct;
    dg.innerHTML += `
      <div class="dim-card">
        <div class="dim-label">
          <span>${dim.label}</span>
          <span class="winner" style="color:${colors2[i]}">${winner} ${winPct}%</span>
        </div>
        <div class="dim-bar-bg">
          <div class="dim-bar-fill" style="width:${pct}%;background:${colors2[i]}"></div>
        </div>
      </div>`;
  });

  // style report
  document.getElementById('reportStyleHead').textContent = d.name + '형 티칭 스타일';
  document.getElementById('reportStyleBody').textContent = d.style;

  // strengths
  const sg = document.getElementById('strengthGrid');
  sg.innerHTML = d.strengths.map(s => `<div class="strength-item"><span>${s.split(' ')[0]}</span>${s.split(' ').slice(1).join(' ')}</div>`).join('');

  // activity
  document.getElementById('activityDesc').textContent = `${d.name}형 교사에게 특히 잘 맞는 활동 카드예요.`;
  const ag = document.getElementById('activityGrid');
  ag.innerHTML = d.activities.map(a => `<div class="activity-chip"><span class="a-emoji">${a.e}</span>${a.n}</div>`).join('');

  // growth
  document.getElementById('reportGrowth').textContent = d.growth;
  const tg = document.getElementById('growthTags');
  tg.innerHTML = d.tags.map(t => `<span class="tag">${t}</span>`).join('');

  window.scrollTo(0, 0);
}

function retry() {
  answers = new Array(20).fill(3);
  current = 0;
  document.getElementById('result').style.display = 'none';
  document.getElementById('intro').style.display = 'flex';
}
